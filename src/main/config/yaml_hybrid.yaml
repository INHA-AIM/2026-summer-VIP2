target_vel: 20.0
curve_vel: 12.0
obstacle_vel: 10.0

#curve_standard: 0.1
# ==> 
# Level 3: 매우 높음 (Sharp)
curve_level3_threshold: 0.008
curve_level3_speed: 30.0

# Level 2: 중간 (Medium)
curve_level2_threshold: 0.004
curve_level2_speed: 50.0

# Level 1: 낮음 (Mild)
curve_level1_threshold: 0.001
curve_level1_speed: 60.0


lookahead_idx: 50
# ===============================================
# gain
# ===============================================
ld_gain: 0.5      # double ld = 5.0 + ld_gain * ego.vel;
k_gain: 1

# ===============================================
# pid
# ===============================================
Kp: 0.3
Ki: 0.02
Kd: 0

