services:
  aim-noetic-pc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vip2-noetic:pc
    container_name: vip2-noetic-pc

    # Docker Desktop(Windows) + MORAI(127.0.0.1:9090)용
    # host 네트워크는 Desktop에서 Windows localhost로 포트가 안 열려 rosbridge 연결이 실패함
    ports:
      - "9090:9090"       # MORAI ROS Bridge (WebSocket)
      - "11311:11311"     # ROS master (디버그용)
      - "9095:9095/udp"   # MORAI UDP ego ctrl (옵션)
      - "9096:9096/udp"

    gpus: all

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
      - DISPLAY=${DISPLAY:-}
      - QT_X11_NO_MITSHM=1
      # 컨테이너 내부 ROS. rosbridge는 0.0.0.0:9090 에서 Windows 127.0.0.1로 publish
      - ROS_MASTER_URI=http://localhost:11311

    volumes:
      - ${VIP2:-..}:/root/vip2:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro

    shm_size: "2gb"
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
